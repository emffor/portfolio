<svg width="800" height="460" viewBox="0 0 800 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d0b"/>
      <stop offset="50%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#090d0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16221c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f1714" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2e26" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" fill="url(#bgGrad)"/>
  <rect width="800" height="460" fill="url(#gridPattern)"/>

  <!-- Glow Effect -->
  <circle cx="400" cy="180" r="180" fill="#10b981" fill-opacity="0.07" filter="blur(40px)"/>

  <!-- App Window Container -->
  <g transform="translate(60, 45)">
    <!-- Window Frame -->
    <rect width="680" height="370" rx="8" fill="#0d1411" stroke="#22362b" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect width="680" height="40" rx="8" fill="#131e18"/>
    <rect y="32" width="680" height="8" fill="#131e18"/>
    <line x1="0" y1="40" x2="680" y2="40" stroke="#22362b" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="20" r="4" fill="#364d40"/>
    <circle cx="38" cy="20" r="4" fill="#2d4036"/>
    <circle cx="52" cy="20" r="4" fill="#2d4036"/>

    <!-- Address / Title -->
    <rect x="230" y="10" width="220" height="20" rx="4" fill="#0a100d" stroke="#22362b" stroke-width="1"/>
    <text x="340" y="24" fill="#719482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">app.laflora.agro / homologacao</text>

    <!-- Sidebar -->
    <rect x="0" y="41" width="160" height="328" rx="0" fill="#0b120f"/>
    <line x1="160" y1="41" x2="160" y2="369" stroke="#22362b" stroke-width="1"/>

    <!-- Sidebar Brand -->
    <circle cx="28" cy="68" r="8" fill="url(#accentGrad)"/>
    <rect x="46" y="64" width="70" height="9" rx="2" fill="#d1fae5" fill-opacity="0.9"/>

    <!-- Sidebar Nav Items -->
    <g transform="translate(16, 96)">
      <!-- Active Item -->
      <rect x="0" y="0" width="128" height="28" rx="4" fill="#16271e" stroke="#22362b" stroke-width="0.75"/>
      <rect x="10" y="9" width="10" height="10" rx="2" fill="#10b981"/>
      <rect x="28" y="10" width="72" height="8" rx="2" fill="#e6fcf5"/>

      <!-- Item 2 -->
      <rect x="10" y="41" width="10" height="10" rx="2" fill="#2c3e34"/>
      <rect x="28" y="42" width="60" height="8" rx="2" fill="#698576"/>

      <!-- Item 3 -->
      <rect x="10" y="69" width="10" height="10" rx="2" fill="#2c3e34"/>
      <rect x="28" y="70" width="50" height="8" rx="2" fill="#698576"/>

      <!-- Item 4 -->
      <rect x="10" y="97" width="10" height="10" rx="2" fill="#2c3e34"/>
      <rect x="28" y="98" width="65" height="8" rx="2" fill="#698576"/>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(180, 56)">
      <!-- Page Header -->
      <text x="0" y="20" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Painel de Fornecedores Agropecuários</text>
      <text x="0" y="38" fill="#719482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Homologação multiempresa e conformidade socioambiental</text>

      <!-- KPI Cards -->
      <g transform="translate(0, 52)">
        <!-- KPI 1 -->
        <rect width="150" height="64" rx="6" fill="#121d17" stroke="#22362b" stroke-width="1"/>
        <text x="14" y="24" fill="#8ca89a" font-family="sans-serif" font-size="10">FORNECEDORES ATIVOS</text>
        <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">1.480</text>
        <circle cx="132" cy="24" r="3" fill="#10b981"/>

        <!-- KPI 2 -->
        <rect x="162" width="150" height="64" rx="6" fill="#121d17" stroke="#22362b" stroke-width="1"/>
        <text x="176" y="24" fill="#8ca89a" font-family="sans-serif" font-size="10">EM CONFORMIDADE</text>
        <text x="176" y="48" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="700">98.2%</text>

        <!-- KPI 3 -->
        <rect x="324" width="150" height="64" rx="6" fill="#121d17" stroke="#22362b" stroke-width="1"/>
        <text x="338" y="24" fill="#8ca89a" font-family="sans-serif" font-size="10">AUDITORIAS PENDENTES</text>
        <text x="338" y="48" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="700">24</text>
      </g>

      <!-- Data Table Mock -->
      <g transform="translate(0, 132)">
        <rect width="474" height="154" rx="6" fill="#101914" stroke="#22362b" stroke-width="1"/>

        <!-- Table Header -->
        <rect width="474" height="30" rx="6" fill="#14211a"/>
        <rect y="24" width="474" height="6" fill="#14211a"/>
        <line x1="0" y1="30" x2="474" y2="30" stroke="#22362b" stroke-width="1"/>

        <text x="16" y="20" fill="#8ca89a" font-family="sans-serif" font-size="10" font-weight="600">PRODUTOR / EMPRESA</text>
        <text x="180" y="20" fill="#8ca89a" font-family="sans-serif" font-size="10" font-weight="600">REGIÃO</text>
        <text x="280" y="20" fill="#8ca89a" font-family="sans-serif" font-size="10" font-weight="600">STATUS CAR</text>
        <text x="390" y="20" fill="#8ca89a" font-family="sans-serif" font-size="10" font-weight="600">HOMOLOGAÇÃO</text>

        <!-- Row 1 -->
        <line x1="0" y1="62" x2="474" y2="62" stroke="#1a2b22" stroke-width="1"/>
        <text x="16" y="50" fill="#f0fdf4" font-family="sans-serif" font-size="11" font-weight="500">Agropecuária Vale Verde</text>
        <text x="180" y="50" fill="#9db5a9" font-family="sans-serif" font-size="11">Mato Grosso</text>
        <rect x="280" y="40" width="64" height="16" rx="3" fill="#064e3b"/>
        <text x="312" y="52" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">ATIVO</text>
        <rect x="390" y="40" width="70" height="16" rx="3" fill="#162e22" stroke="#10b981" stroke-width="0.5"/>
        <text x="425" y="52" fill="#6ee7b7" font-family="sans-serif" font-size="9" text-anchor="middle">APROVADO</text>

        <!-- Row 2 -->
        <line x1="0" y1="94" x2="474" y2="94" stroke="#1a2b22" stroke-width="1"/>
        <text x="16" y="82" fill="#f0fdf4" font-family="sans-serif" font-size="11" font-weight="500">Fazenda Santa Helena</text>
        <text x="180" y="82" fill="#9db5a9" font-family="sans-serif" font-size="11">Goiás</text>
        <rect x="280" y="72" width="64" height="16" rx="3" fill="#064e3b"/>
        <text x="312" y="84" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">ATIVO</text>
        <rect x="390" y="72" width="70" height="16" rx="3" fill="#162e22" stroke="#10b981" stroke-width="0.5"/>
        <text x="425" y="84" fill="#6ee7b7" font-family="sans-serif" font-size="9" text-anchor="middle">APROVADO</text>

        <!-- Row 3 -->
        <line x1="0" y1="126" x2="474" y2="126" stroke="#1a2b22" stroke-width="1"/>
        <text x="16" y="114" fill="#f0fdf4" font-family="sans-serif" font-size="11" font-weight="500">Grupo Primavera S/A</text>
        <text x="180" y="114" fill="#9db5a9" font-family="sans-serif" font-size="11">Paraná</text>
        <rect x="280" y="104" width="64" height="16" rx="3" fill="#451a03"/>
        <text x="312" y="116" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">REVISÃO</text>
        <rect x="390" y="104" width="70" height="16" rx="3" fill="#2d2211" stroke="#f59e0b" stroke-width="0.5"/>
        <text x="425" y="116" fill="#fcd34d" font-family="sans-serif" font-size="9" text-anchor="middle">EM ANÁLISE</text>
      </g>
    </g>
  </g>
</svg>
