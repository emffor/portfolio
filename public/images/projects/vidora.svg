<svg width="800" height="460" viewBox="0 0 800 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vidoraBg" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d0b"/>
      <stop offset="50%" stop-color="#0f1714"/>
      <stop offset="100%" stop-color="#090d0b"/>
    </linearGradient>
    <linearGradient id="vidoraAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="vidoraGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2e26" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" fill="url(#vidoraBg)"/>
  <rect width="800" height="460" fill="url(#vidoraGrid)"/>

  <!-- Glow Effect -->
  <circle cx="400" cy="180" r="180" fill="#10b981" fill-opacity="0.07" filter="blur(40px)"/>

  <!-- App Window Container -->
  <g transform="translate(60, 45)">
    <!-- Window Frame -->
    <rect width="680" height="370" rx="8" fill="#0d1411" stroke="#22362b" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect width="680" height="40" rx="8" fill="#131e18"/>
    <rect y="32" width="680" height="8" fill="#131e18"/>
    <line x1="0" y1="40" x2="680" y2="40" stroke="#22362b" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="20" r="4" fill="#364d40"/>
    <circle cx="38" cy="20" r="4" fill="#2d4036"/>
    <circle cx="52" cy="20" r="4" fill="#2d4036"/>

    <!-- Address / Title -->
    <rect x="250" y="10" width="180" height="20" rx="4" fill="#0a100d" stroke="#22362b" stroke-width="1"/>
    <text x="340" y="24" fill="#719482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">vidora / descobrir</text>

    <!-- Sidebar -->
    <rect x="0" y="41" width="160" height="328" rx="0" fill="#0b120f"/>
    <line x1="160" y1="41" x2="160" y2="369" stroke="#22362b" stroke-width="1"/>

    <!-- Sidebar Brand -->
    <circle cx="28" cy="68" r="8" fill="url(#vidoraAccent)"/>
    <rect x="46" y="64" width="70" height="9" rx="2" fill="#d1fae5" fill-opacity="0.9"/>

    <!-- Sidebar Nav Items -->
    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="128" height="28" rx="4" fill="#16271e" stroke="#22362b" stroke-width="0.75"/>
      <rect x="10" y="9" width="10" height="10" rx="2" fill="#10b981"/>
      <rect x="28" y="10" width="72" height="8" rx="2" fill="#e6fcf5"/>

      <rect x="10" y="41" width="10" height="10" rx="2" fill="#2c3e34"/>
      <rect x="28" y="42" width="60" height="8" rx="2" fill="#698576"/>

      <rect x="10" y="69" width="10" height="10" rx="2" fill="#2c3e34"/>
      <rect x="28" y="70" width="50" height="8" rx="2" fill="#698576"/>

      <rect x="10" y="97" width="10" height="10" rx="2" fill="#2c3e34"/>
      <rect x="28" y="98" width="65" height="8" rx="2" fill="#698576"/>
    </g>

    <!-- Services footer in sidebar -->
    <g transform="translate(16, 268)" font-family="monospace" font-size="9" fill="#5b7568">
      <text x="0" y="0">gateway :3000</text>
      <text x="0" y="18">auth :3001</text>
      <text x="0" y="36">video :3002</text>
      <text x="0" y="54">favorites :3003</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(180, 56)">
      <text x="0" y="20" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Descobrir vídeos</text>
      <text x="0" y="38" fill="#719482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pesquisa via YouTube Data API com favoritos por usuário</text>

      <!-- Search bar -->
      <g transform="translate(0, 50)">
        <rect width="474" height="36" rx="6" fill="#0a100d" stroke="#22362b" stroke-width="1"/>
        <circle cx="22" cy="18" r="7" fill="none" stroke="#3b5448" stroke-width="1.5"/>
        <line x1="27" y1="23" x2="32" y2="28" stroke="#3b5448" stroke-width="1.5"/>
        <rect x="44" y="14" width="180" height="8" rx="2" fill="#698576"/>
        <rect x="392" y="8" width="70" height="20" rx="4" fill="url(#vidoraAccent)"/>
        <text x="427" y="22" fill="#04120c" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Buscar</text>
      </g>

      <!-- Video cards -->
      <g transform="translate(0, 98)">
        <!-- Card 1 -->
        <rect width="150" height="120" rx="6" fill="#121d17" stroke="#22362b" stroke-width="1"/>
        <rect x="0" y="0" width="150" height="70" rx="6" fill="#0f1a14"/>
        <circle cx="75" cy="35" r="14" fill="none" stroke="#10b981" stroke-width="1.5"/>
        <path d="M 71 28 L 82 35 L 71 42 Z" fill="#10b981"/>
        <rect x="12" y="82" width="110" height="8" rx="2" fill="#d7e8df"/>
        <rect x="12" y="96" width="70" height="7" rx="2" fill="#5b7568"/>

        <!-- Card 2 -->
        <rect x="162" width="150" height="120" rx="6" fill="#121d17" stroke="#22362b" stroke-width="1"/>
        <rect x="162" y="0" width="150" height="70" rx="6" fill="#0f1a14"/>
        <circle cx="237" cy="35" r="14" fill="none" stroke="#10b981" stroke-width="1.5"/>
        <path d="M 233 28 L 244 35 L 233 42 Z" fill="#10b981"/>
        <rect x="174" y="82" width="100" height="8" rx="2" fill="#d7e8df"/>
        <rect x="174" y="96" width="60" height="7" rx="2" fill="#5b7568"/>

        <!-- Card 3 -->
        <rect x="324" width="150" height="120" rx="6" fill="#121d17" stroke="#22362b" stroke-width="1"/>
        <rect x="324" y="0" width="150" height="70" rx="6" fill="#0f1a14"/>
        <circle cx="399" cy="35" r="14" fill="none" stroke="#10b981" stroke-width="1.5"/>
        <path d="M 395 28 L 406 35 L 395 42 Z" fill="#10b981"/>
        <rect x="336" y="82" width="105" height="8" rx="2" fill="#d7e8df"/>
        <rect x="336" y="96" width="64" height="7" rx="2" fill="#5b7568"/>
      </g>

      <!-- Gateway strip -->
      <g transform="translate(0, 230)">
        <rect width="474" height="56" rx="6" fill="#101914" stroke="#22362b" stroke-width="1"/>
        <text x="16" y="22" fill="#8ca89a" font-family="monospace" font-size="10">API GATEWAY :3000 → auth · video · favorites</text>
        <text x="16" y="40" fill="#5b7568" font-family="monospace" font-size="10">REST / JSON · Bearer · timeout</text>
      </g>
    </g>
  </g>
</svg>
