<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d0e"/>
      <stop offset="50%" stop-color="#0f1718"/>
      <stop offset="100%" stop-color="#0a1213"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#386863"/>
      <stop offset="50%" stop-color="#63a39c"/>
      <stop offset="100%" stop-color="#76b3ac"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e20" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1617" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#63a39c" stroke-width="1">
    <path d="M0,150 H1200 M0,300 H1200 M0,450 H1200 M0,600 H1200" />
    <path d="M150,0 V750 M300,0 V750 M450,0 V750 M600,0 V750 M750,0 V750 M900,0 V750 M1050,0 V750" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="600" cy="375" r="280" fill="#63a39c" opacity="0.08" filter="url(#glow)"/>

  <!-- Left: 11 Legacy Microservices Block -->
  <g transform="translate(100, 160)">
    <!-- Container -->
    <rect width="320" height="430" rx="16" fill="url(#cardGrad)" stroke="#293536" stroke-width="1.5"/>
    <text x="28" y="46" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#96a3a1" letter-spacing="1.5">ARQUITETURA ANTERIOR</text>
    <text x="28" y="78" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#eef2f1">11 Microsserviços</text>
    <text x="28" y="104" font-family="system-ui, sans-serif" font-size="14" fill="#667572">11 bancos isolados · Node.js</text>

    <!-- Mini services matrix -->
    <g transform="translate(28, 135)">
      <!-- 11 mini service boxes -->
      <rect x="0" y="0" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="38" y="30" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 1</text>
      
      <rect x="92" y="0" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="130" y="30" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 2</text>

      <rect x="184" y="0" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="222" y="30" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 3</text>

      <rect x="0" y="65" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="38" y="95" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 4</text>
      
      <rect x="92" y="65" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="130" y="95" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 5</text>

      <rect x="184" y="65" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="222" y="95" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 6</text>

      <rect x="0" y="130" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="38" y="160" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 7</text>
      
      <rect x="92" y="130" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="130" y="160" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 8</text>

      <rect x="184" y="130" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="222" y="160" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 9</text>

      <rect x="46" y="195" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="84" y="225" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 10</text>
      
      <rect x="138" y="195" width="76" height="50" rx="8" fill="#182325" stroke="#293536"/>
      <text x="176" y="225" text-anchor="middle" font-family="system-ui" font-size="11" fill="#96a3a1">Serviço 11</text>
    </g>
  </g>

  <!-- Center: Convergence Transition Arrow -->
  <g transform="translate(460, 345)">
    <line x1="0" y1="30" x2="240" y2="30" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6,6"/>
    <!-- Glow pulse circle -->
    <circle cx="120" cy="30" r="32" fill="#0f1617" stroke="#63a39c" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#63a39c">→</text>
    <text x="120" y="78" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#63a39c">CONSOLIDAÇÃO</text>
  </g>

  <!-- Right: Unified Modular Architecture Block -->
  <g transform="translate(740, 160)">
    <rect width="360" height="430" rx="16" fill="url(#cardGrad)" stroke="#63a39c" stroke-width="2"/>
    <text x="32" y="46" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#63a39c" letter-spacing="1.5">ARQUITETURA CONSOLIDADA</text>
    <text x="32" y="78" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#eef2f1">Monólito Modular</text>
    <text x="32" y="104" font-family="system-ui, sans-serif" font-size="14" fill="#96a3a1">Laravel 11 · Base de Dados Unificada</text>

    <!-- Layers of Unified Architecture -->
    <g transform="translate(32, 135)">
      <rect x="0" y="0" width="296" height="52" rx="8" fill="#182527" stroke="#386863" stroke-width="1.5"/>
      <text x="20" y="31" font-family="system-ui" font-size="14" font-weight="600" fill="#eef2f1">Camada de Apresentação &amp; APIs</text>

      <rect x="0" y="68" width="296" height="52" rx="8" fill="#182527" stroke="#386863" stroke-width="1.5"/>
      <text x="20" y="99" font-family="system-ui" font-size="14" font-weight="600" fill="#eef2f1">Módulos de Domínio &amp; Services</text>

      <rect x="0" y="136" width="296" height="52" rx="8" fill="#182527" stroke="#386863" stroke-width="1.5"/>
      <text x="20" y="167" font-family="system-ui" font-size="14" font-weight="600" fill="#eef2f1">Fronteiras SOLID &amp; Repositories</text>

      <rect x="0" y="204" width="296" height="52" rx="8" fill="#1d3032" stroke="#63a39c" stroke-width="2"/>
      <text x="20" y="235" font-family="system-ui" font-size="14" font-weight="700" fill="#63a39c">Base Relacional Única (ACID)</text>
    </g>
  </g>
</svg>
